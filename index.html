<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scumbag Invitational</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f2f0e7;
    --stripe:rgba(18,51,31,0.045);
    --hero:#dce6d8;
    --panel:#ffffff;
    --panel-raised:#f6f5ee;
    --line:#c4cec1;
    --row-line:rgba(60,90,69,0.18);
    --text:#15251b;
    --text-dim:#566759;
    --gold:#9c5f05;
    --gold-label:#7b5b22;
    --alert:#b3401f;
    --win-bg:rgba(156,95,5,0.09);
    --primary-bg:#15361f;
    --primary-fg:#ffffff;
    --field:#ffffff;
    --alive-bg:rgba(47,122,61,0.12);
    --alive-fg:#27632f;
    --out-bg:rgba(179,64,31,0.1);
    --radius:6px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1710;
      --stripe:rgba(255,255,255,0.025);
      --hero:#12331f;
      --panel:#152018;
      --panel-raised:#1b2a1f;
      --line:#3c5a45;
      --row-line:rgba(60,90,69,0.4);
      --text:#f2f0e8;
      --text-dim:#a9b3a8;
      --gold:#e3a53d;
      --gold-label:#c19a4f;
      --alert:#e0714a;
      --win-bg:rgba(227,165,61,0.08);
      --primary-bg:#e3a53d;
      --primary-fg:#1a1305;
      --field:#0d1710;
      --alive-bg:rgba(60,90,69,0.4);
      --alive-fg:#8fd99a;
      --out-bg:rgba(193,80,46,0.18);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1710;
    --stripe:rgba(255,255,255,0.025);
    --hero:#12331f;
    --panel:#152018;
    --panel-raised:#1b2a1f;
    --line:#3c5a45;
    --row-line:rgba(60,90,69,0.4);
    --text:#f2f0e8;
    --text-dim:#a9b3a8;
    --gold:#e3a53d;
    --gold-label:#c19a4f;
    --alert:#e0714a;
    --win-bg:rgba(227,165,61,0.08);
    --primary-bg:#e3a53d;
    --primary-fg:#1a1305;
    --field:#0d1710;
    --alive-bg:rgba(60,90,69,0.4);
    --alive-fg:#8fd99a;
    --out-bg:rgba(193,80,46,0.18);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(90deg, var(--stripe) 0px, var(--stripe) 1px, transparent 1px, transparent 64px),
      var(--bg);
    background-color:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
    padding:0 0 80px 0;
  }
  .marquee{
    text-align:center;
    padding:44px 20px 24px;
    border-bottom:2px solid var(--line);
    background:linear-gradient(180deg, var(--hero) 0%, transparent 100%);
  }
  .eyebrow{
    font-family:'Space Mono',ui-monospace,monospace;
    letter-spacing:0.25em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold);
  }
  .marquee h1{
    font-family:'Anton',Impact,'Arial Narrow',sans-serif;
    font-weight:400;
    font-size:clamp(38px,7vw,72px);
    letter-spacing:0.02em;
    margin:8px 0 4px;
    text-transform:uppercase;
    color:var(--text);
  }
  .sub{color:var(--text-dim);font-size:14px;font-family:'Space Mono',ui-monospace,monospace;}
  .kickoff{
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:12px;
    color:var(--gold);
    margin-top:10px;
    letter-spacing:0.03em;
  }
  .status-bar{
    max-width:1400px;
    margin:16px auto 0;
    padding:0 20px;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:11.5px;
    color:var(--text-dim);
    text-align:center;
    line-height:1.5;
  }
  .status-bar .pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    border:1px solid var(--gold);
    color:var(--gold);
    margin-right:6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:10.5px;
  }
  .sync-row{text-align:center;margin-top:12px;}
  button:disabled{opacity:.6;cursor:wait;}
  .tag-live{background:var(--out-bg);color:var(--alert);border:1px solid var(--alert);display:inline-flex;align-items:center;gap:5px;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--alert);animation:pulseDot 1.2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
  .team-score.live{font-style:italic;color:var(--text-dim);}
  .team-score.live.lead{color:var(--gold);}
  @media (prefers-reduced-motion: reduce){.live-dot{animation:none;}}
  .section-label{
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold-label);
    margin:40px auto 12px;
    max-width:1400px;
    padding:0 20px;
  }

  .roster, .predictions{max-width:1400px;margin:0 auto;padding:0 20px;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
  .roster-table{width:100%;border-collapse:collapse;min-width:420px;}
  .roster-table th{
    text-align:left;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .roster-table td{padding:8px 12px;border-bottom:1px solid var(--row-line);font-size:14px;}
  .roster-table tr:last-child td{border-bottom:none;}
  .roster-table .num{font-family:'Space Mono',ui-monospace,monospace;font-size:13px;}
  .name-cell{display:flex;align-items:center;gap:8px;}
  .seed-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;
    background:var(--line);color:var(--text);
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:12px;font-weight:700;
  }
  .seed-badge.bye{background:transparent;border:1px dashed var(--line);color:var(--text-dim);}
  .bye-row td{color:var(--text-dim);font-style:italic;}

  .avatar{
    width:22px;height:22px;border-radius:50%;
    color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:9px;font-weight:700;
    margin-right:6px;flex-shrink:0;
  }
  .name-cell .avatar{margin-right:0;}

  .bracket-wrap{max-width:1400px;margin:0 auto;padding:0 20px;overflow-x:auto;}
  .bracket{display:flex;gap:48px;min-width:1100px;padding:20px 0 40px;}
  .round{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:16px;position:relative;}
  .round-header{
    text-align:center;
    font-family:'Anton',Impact,sans-serif;
    font-size:16px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--gold);margin-bottom:6px;
  }
  .round-week{
    text-align:center;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:11px;color:var(--text-dim);margin-bottom:14px;
  }
  .round-recap-inline{
    font-size:11px;font-style:italic;line-height:1.45;color:var(--text-dim);
    text-align:center;margin:0 0 14px;padding:0 4px;
  }
  .match{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;position:relative;
  }
  .match.champion{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(227,165,61,0.25);}
  .team-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px;}
  .team-row + .team-row{border-top:1px solid var(--row-line);}
  .team-row.winner{background:var(--win-bg);}
  .team-row.winner .team-name{color:var(--gold);font-weight:700;}
  .team-row.eliminated .team-name{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--alert);}
  .team-left{display:flex;align-items:center;min-width:0;flex:1;}
  .team-name{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .team-seed{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;color:var(--text-dim);margin-right:6px;}
  .team-score{font-family:'Space Mono',ui-monospace,monospace;font-weight:700;font-size:14px;text-align:right;color:var(--text);}
  .bye-tag{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;color:var(--text-dim);font-style:italic;}
  .tbd .team-name{color:var(--text-dim);font-style:italic;}
  .recap{font-size:11.5px;font-style:italic;line-height:1.4;color:var(--text-dim);padding:8px 12px 10px;border-top:1px dashed var(--line);}

  .badge-row{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;}
  .tag{
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:9.5px;letter-spacing:0.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;font-weight:700;
  }
  .tag-upset{background:var(--out-bg);color:var(--alert);border:1px solid var(--alert);}
  .tag-blowout{background:var(--win-bg);color:var(--gold);border:1px solid var(--gold);}
  .tag-nailbiter{background:var(--panel-raised);color:var(--text);border:1px solid var(--line);}

  @keyframes glowPulse{
    0%{box-shadow:0 0 0 1px var(--gold),0 0 0 rgba(227,165,61,0);}
    35%{box-shadow:0 0 0 1px var(--gold),0 0 32px rgba(227,165,61,0.55);}
    100%{box-shadow:0 0 0 1px var(--line),0 0 0 rgba(227,165,61,0);}
  }
  .match.just-decided{animation:glowPulse 1.4s ease;}
  .confetti-piece{
    position:absolute;top:-10px;width:6px;height:10px;opacity:0.95;
    pointer-events:none;animation:confettiFall 1.1s ease-in forwards;z-index:5;
  }
  @keyframes confettiFall{to{transform:translateY(160px) rotate(360deg);opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .match.just-decided{animation:none;}
    .confetti-piece{display:none;}
  }

  .champion-banner{max-width:1400px;margin:8px auto 0;padding:0 20px;text-align:center;}
  .champion-banner .plate{
    display:inline-block;background:var(--panel-raised);border:1px solid var(--gold);
    border-radius:var(--radius);padding:18px 32px;
    font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:0.03em;
    color:var(--gold);text-transform:uppercase;
  }

  button{
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
    background:var(--panel-raised);color:var(--text);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 16px;cursor:pointer;transition:all .15s ease;
  }
  button:hover{border-color:var(--gold);color:var(--gold);}
  button.primary{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-bg);font-weight:700;}
  button.primary:hover{opacity:.9;color:var(--primary-fg);}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .mull-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .mull select, .mull input[type=password]{
    font-family:'Inter',system-ui,sans-serif;font-size:14px;
    background:var(--field);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:9px 12px;min-width:240px;max-width:100%;
  }
  .mull-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;margin-bottom:12px;}
  .mull-grid label{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.04em;}
  .mull-grid select{width:100%;min-width:0;}
  .mull-note{font-size:13px;color:var(--text-dim);line-height:1.6;margin:0 0 12px;max-width:760px;}
  .mull-note.err{color:var(--alert);}
  .mull-preview{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;font-size:13px;line-height:1.6;max-width:760px;margin-bottom:12px;}
  .mull-log{max-width:760px;margin-top:18px;}
  .mull-log-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.5;}
  .mull-log-row.void{opacity:.55;text-decoration:line-through;}
  .mull-log-row .when{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--text-dim);display:block;}
  .mull-glyph{color:var(--gold);font-size:12px;margin-left:5px;cursor:help;}
  .mull details{margin-top:16px;max-width:760px;font-size:13px;color:var(--text-dim);}
  .mull details summary{cursor:pointer;}
  @media (max-width:560px){.mull-grid{grid-template-columns:1fr;}.mull select,.mull input[type=password]{min-width:0;width:100%;}}
  .predict-intro{font-size:13px;color:var(--text-dim);line-height:1.6;margin:0 0 14px;max-width:760px;}
  .predict-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .predict-controls input[type=text]{
    font-family:'Inter',system-ui,sans-serif;font-size:14px;
    background:var(--field);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:9px 12px;min-width:220px;
  }
  .predict-status{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--text-dim);}
  .predict-round-title{
    font-family:'Anton',Impact,sans-serif;font-size:14px;text-transform:uppercase;
    letter-spacing:0.04em;color:var(--gold);margin:20px 0 8px;
  }
  .predict-row{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .predict-options{display:flex;gap:18px;flex-wrap:wrap;}
  .predict-options label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;}
  .predict-row.auto{color:var(--text-dim);font-style:italic;font-size:12.5px;}
  .code-wrap{display:none;margin-top:14px;}
  .code-wrap.open{display:block;}
  .code-wrap textarea{
    display:block;width:100%;min-height:76px;margin-bottom:10px;
    background:var(--field);border:1px solid var(--line);color:var(--text);
    border-radius:var(--radius);padding:9px 12px;
    font-family:'Space Mono',ui-monospace,monospace;font-size:11px;
  }
  .status-pill{
    font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;text-transform:uppercase;
    padding:3px 8px;border-radius:20px;letter-spacing:0.04em;white-space:nowrap;
  }
  .status-alive{background:var(--alive-bg);color:var(--alive-fg);border:1px solid var(--alive-fg);}
  .status-out{background:var(--out-bg);color:var(--alert);border:1px solid var(--alert);}
  .status-none{background:transparent;color:var(--text-dim);border:1px solid var(--line);}

  .footnote{
    max-width:1400px;margin:40px auto 0;padding:0 20px;
    color:var(--text-dim);font-size:12px;
    font-family:'Space Mono',ui-monospace,monospace;line-height:1.7;
  }
  @media (max-width:640px){
    .marquee h1{font-size:34px;}
    .predict-controls input[type=text]{min-width:0;width:100%;}
  }
</style>
</head>
<body>

<div class="marquee">
  <div class="eyebrow">ESPN Fantasy Football · 2026 Season</div>
  <h1>The Scumbag Invitational</h1>
  <div class="sub" id="subLine"></div>
  <div class="kickoff" id="kickoffLine"></div>
</div>
<div class="status-bar" id="statusBar"></div>
<div class="sync-row"><button class="primary" id="syncBtn">Sync scores from ESPN</button></div>

<div class="section-label">Standings — sets seeding (record, then points for)</div>
<div class="roster">
  <div class="table-scroll">
    <table class="roster-table">
      <thead>
        <tr><th style="width:44px;">Seed</th><th>Team</th><th style="width:60px;">W</th><th style="width:60px;">L</th><th style="width:100px;">Points For</th></tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>
  </div>
</div>

<div class="section-label">Bracket</div>
<div class="bracket-wrap"><div class="bracket" id="bracketEl"></div></div>
<div class="champion-banner" id="championBanner"></div>

<div class="section-label">Mulligans</div>
<div class="mull" id="mullSection">
  <p class="predict-intro" id="mullIntro"></p>
  <div class="mull-controls"><select id="mullTeam" aria-label="Choose your team"></select></div>
  <div id="mullPanel"></div>
  <div class="mull-log" id="mullLog"></div>
  <details id="mullAdmin">
    <summary>Commissioner</summary>
    <div class="mull-controls" style="margin-top:10px;">
      <input type="password" id="mullKey" placeholder="Commissioner key" autocomplete="off">
    </div>
    <div id="mullAdminList"></div>
  </details>
</div>

<div class="section-label">Bracket predictions</div>
<div class="predictions" id="predictionsSection">
  <p class="predict-intro" id="predictIntro"></p>
  <div id="predictForm">
    <div class="predict-controls">
      <input type="text" id="predictorName" placeholder="Your name" autocomplete="off">
      <button class="primary" id="makeCodeBtn">Get my picks code</button>
      <span class="predict-status" id="predictStatus"></span>
    </div>
    <div class="code-wrap" id="codeWrap">
      <textarea id="codeBox" readonly></textarea>
      <button id="copyCodeBtn">Copy code</button>
    </div>
    <div id="predictPicker"></div>
  </div>
</div>

<div class="section-label">Predictions leaderboard</div>
<div class="roster">
  <div class="table-scroll">
    <table class="roster-table">
      <thead>
        <tr><th>Predictor</th><th style="width:130px;">Champion pick</th><th style="width:110px;">Correct</th><th style="width:170px;">Status</th></tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>
</div>

<div class="footnote" id="footnote"></div>

  const CFG = {
    WORKER_URL: USER_CFG.WORKER_URL || "",

    const ms = BRACKET[rIdx].filter(m => m.teamA && m.teamB);
    if(!ms.length || !ms.every(m => m.complete)) return '';
    const info = ms.map(m => {
      const wA = m.winner === 'A';
      return { w: wA ? m.teamA : m.teamB, l: wA ? m.teamB : m.teamA,
               margin: Math.abs(m.scoreA - m.scoreB),

    const parts = [];
    const ups = info.filter(x => x.upset);
    if(ups.length) parts.push(`${ups.length} upset${ups.length > 1 ? 's' : ''} (${ups.map(x => x.w.name).join(', ')}) — the seeds were apparently just a suggestion.`);

      const big = [...info].sort((a, b) => b.margin - a.margin)[0];

      parts.push(`${big.w.name} flattened ${big.l.name} by ${big.margin.toFixed(2)}, the round's biggest beating.`);

  function parseEspn(data){
    if(!data || data.error) throw new Error((data && data.error) || 'Empty response');
    if(!Array.isArray(data.teams) || !data.teams.length) throw new Error('No team data in the response');
    if(data.teams.length !== 14) throw new Error(`League has ${data.teams.length} teams; the bracket expects 14`);
    const cur = data.scoringPeriodId || 0;
    const teams = data.teams.map(t => {
      const o = (t.record && t.record.overall) || {};
      return { id: t.id, name: t.name || `${t.location || ''} ${t.nickname || ''}`.trim() || `Team ${t.id}`,
               wins: o.wins || 0, losses: o.losses || 0, pf: o.pointsFor || 0 };
    });
    const stats = {}, periodScores = {}, livePeriod = {};
    let sawSeedWeeks = false, asOf = 0;
    const pts = (side, p) => typeof side.totalPoints === 'number' ? side.totalPoints
      : (side.pointsByScoringPeriod && typeof side.pointsByScoringPeriod[p] === 'number') ? side.pointsByScoringPeriod[p] : null;

    (data.schedule || []).forEach(m => {
      const p = m.matchupPeriodId;
      const final = (m.winner && m.winner !== 'UNDECIDED') || cur > p;
      const sides = [m.home, m.away].filter(Boolean);
      if(!final){
        // In-progress week: keep the running score for display only (never decides a winner).
        if(p === cur && CFG.ROUND_PERIODS.includes(p)){
          livePeriod[p] = livePeriod[p] || {};
          sides.forEach(s => {
            const v = typeof s.livePoints === 'number' ? s.livePoints : pts(s, p);
            if(v != null) livePeriod[p][s.teamId] = v;
          });
        }
        return;
      }
      if(p <= CFG.SEED_THROUGH_WEEK){
        sawSeedWeeks = true; asOf = Math.max(asOf, p);
        sides.forEach(s => {
          const st = stats[s.teamId] = stats[s.teamId] || { wins:0, losses:0, pf:0 };
          const v = pts(s, p); if(v != null) st.pf += v;
        });
        if(m.home && m.away && (m.winner === 'HOME' || m.winner === 'AWAY')){
          const w = m.winner === 'HOME' ? m.home : m.away, l = m.winner === 'HOME' ? m.away : m.home;
          stats[w.teamId].wins++; stats[l.teamId].losses++;
        }
      }
      if(CFG.ROUND_PERIODS.includes(p)){
        periodScores[p] = periodScores[p] || {};
        sides.forEach(s => { const v = pts(s, p); if(v != null && v > 0) periodScores[p][s.teamId] = v; });
      }
    });
    // Mulligans: swap deltas (bench points on, starter points off) adjust the round scores.
    const mulligans = Array.isArray(data.mulligans) ? data.mulligans : [];
    mulligans.forEach(sw => {
      if(sw.status !== 'active' || typeof sw.delta !== 'number' || !CFG.ROUND_PERIODS.includes(sw.week)) return;
      const ps = periodScores[sw.week], lp = livePeriod[sw.week];
      if(ps && ps[sw.teamId] != null) ps[sw.teamId] = Math.round((ps[sw.teamId] + sw.delta) * 100) / 100;
      if(lp && lp[sw.teamId] != null) lp[sw.teamId] = Math.round((lp[sw.teamId] + sw.delta) * 100) / 100;
    });
    if(sawSeedWeeks){
      teams.forEach(t => { const st = stats[t.id]; if(st){ t.wins = st.wins; t.losses = st.losses; t.pf = Math.round(st.pf * 100) / 100; } });
    }
    return { teams, periodScores, livePeriod, mulligans, mulligansEnabled: data.mulligansEnabled !== false,
             asOfWeek: sawSeedWeeks ? asOf : Math.max(0, Math.min(cur - 1, CFG.SEED_THROUGH_WEEK)),
             seedsFinal: (sawSeedWeeks ? asOf : cur - 1) >= CFG.SEED_THROUGH_WEEK };
  }

  // Each team's finalized weekly score goes to whatever bracket match that team is in, one round at a time.
  function buildScores(periodScores, livePeriod){
    const scores = {}, live = {};
    SCORES = scores; LIVE = {};
    for(let r = 1; r <= 4; r++){
      recompute();
      const period = CFG.ROUND_PERIODS[r-1];
      const ps = periodScores[period], lp = (livePeriod || {})[period];
      BRACKET[r-1].forEach((m, i) => {
        if(!m.teamA || !m.teamB) return;
        const id = matchId(r, i);
        if(ps && ps[m.teamA.id] != null && ps[m.teamB.id] != null){
          scores[id] = [ps[m.teamA.id], ps[m.teamB.id]];
        } else if(lp && lp[m.teamA.id] != null && lp[m.teamB.id] != null && (lp[m.teamA.id] > 0 || lp[m.teamB.id] > 0)){
          live[id] = [lp[m.teamA.id], lp[m.teamB.id]];
        }
      });
    }
    LIVE = live;
    return { scores, live };
  }

  function applyParsed(parsed, source, updatedAt){
    DATA = { ...DATA, teams: parsed.teams, asOfWeek: parsed.asOfWeek, seedsFinal: parsed.seedsFinal,
             mulligans: parsed.mulligans || [], mulligansEnabled: parsed.mulligansEnabled,
             updatedAt, source };
    if(source === 'live'){ LIVE_TICK++; try{ localStorage.setItem('midseason-roast-tick', String(LIVE_TICK)); }catch(e){} }
    const built = buildScores(parsed.periodScores, parsed.livePeriod);
    DATA.scores = built.scores; DATA.live = built.live;
    SCORES = DATA.scores; LIVE = DATA.live;
  }

  function saveCache(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ teams: DATA.teams, scores: DATA.scores, live: DATA.live || {},
      asOfWeek: DATA.asOfWeek, seedsFinal: DATA.seedsFinal, mulligans: DATA.mulligans || [], mulligansEnabled: DATA.mulligansEnabled, updatedAt: DATA.updatedAt })); }catch(e){}
  }
  function loadCache(){
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(c && Array.isArray(c.teams) && c.teams.length === 14 && (!SNAPSHOT.updatedAt || c.updatedAt > SNAPSHOT.updatedAt)){
        DATA = { ...DATA, ...c, source: 'cached' };
        SCORES = DATA.scores || {}; LIVE = DATA.live || {};
      }
    }catch(e){}
  }

  async function sync(){
    const btn = $('syncBtn');
    btn.disabled = true;
    syncMsg = 'Syncing…'; syncMsgIsError = false; renderStatus();
    try{
      if(!CFG.WORKER_URL || CFG.WORKER_URL.indexOf('PASTE_YOUR') === 0) throw Object.assign(new Error('Sync isn\'t connected yet — the Worker URL hasn\'t been set.'), {soft:true});
      const res = await fetch(CFG.WORKER_URL, { cache: 'no-store' });
      let json = null;
      try{ json = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((json && json.error) || `Sync service returned HTTP ${res.status}`);
      const parsed = parseEspn(json);
      applyParsed(parsed, 'live', new Date().toISOString());
      saveCache();
      syncMsg = ''; 
    }catch(err){
      syncMsg = (err && err.name === 'TypeError') ? "Couldn't reach the sync service. Showing the last saved scores." : (err.message || 'Sync failed.') + ' Showing the last saved scores.';
      syncMsgIsError = true;
      SCORES = DATA.scores || {}; LIVE = DATA.live || {};
    }finally{
      btn.disabled = false;
      renderAll();
    }
  }

  /* ---------- rendering ---------- */
  function renderStatus(){
    const when = DATA.updatedAt ? new Date(DATA.updatedAt).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
    const src = DATA.source === 'live' ? 'live from ESPN' : DATA.source === 'cached' ? 'saved copy' : 'starting snapshot';
    const pill = DATA.seedsFinal ? 'Seeds locked' : 'Provisional seeds';
    const tail = DATA.seedsFinal ? '' : ` · final seeds lock after Week ${CFG.SEED_THROUGH_WEEK}`;
    const anyLive = Object.keys(LIVE).length > 0;
    let html = `<span class="pill">${pill}</span>Standings through Week ${esc(DATA.asOfWeek)}${tail} · ${src}${when ? ' · ' + esc(when) : ''}${anyLive ? ' · <strong>games in progress — scores are not final</strong>' : ''}`;
    if(syncMsg) html += `<br><span style="color:${syncMsgIsError ? 'var(--alert)' : 'var(--text-dim)'}">${esc(syncMsg)}</span>`;
    $('statusBar').innerHTML = html;
  }

  function renderRoster(){
    const tbody = $('rosterBody');
    tbody.innerHTML = '';
    SORTED.forEach((t, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="seed-badge">${i+1}</span></td>
        <td><div class="name-cell">${avatarHtml(t)}<span>${esc(t.name)}</span></div></td>
        <td class="num">${t.wins}</td><td class="num">${t.losses}</td><td class="num">${Number(t.pf).toFixed(2)}</td>`;
      tbody.appendChild(tr);
    });
    [[15, 2], [16, 1]].forEach(([slot, forSeed]) => {
      const tr = document.createElement('tr');
      tr.className = 'bye-row';
      tr.innerHTML = `<td><span class="seed-badge bye">${slot}</span></td><td colspan="4">Bye — skips round 1 for Seed ${forSeed}</td>`;
      tbody.appendChild(tr);
    });
  }

  function teamRow(m, side, isBye, rIdx){
    const team = side === 'A' ? m.teamA : m.teamB;
    const seed = side === 'A' ? m.seedA : m.seedB;
    const isLive = !m.complete && m.liveA != null && m.liveB != null;
    const score = isLive ? (side === 'A' ? m.liveA : m.liveB) : (side === 'A' ? m.scoreA : m.scoreB);
    const leading = isLive && (side === 'A' ? m.liveA > m.liveB : m.liveB > m.liveA);
    const row = document.createElement('div');
    let cls = 'team-row';
    if(!team) cls += ' tbd';
    if(m.complete && team) cls += (m.winner === side) ? ' winner' : ' eliminated';
    row.className = cls;
    const left = team
      ? `${avatarHtml(team)}<span class="team-seed">${seed ?? ''}</span><span class="team-name">${esc(team.name)}</span>${mullGlyph(team.id, rIdx)}`
      : `<span class="team-name">TBD</span>`;
    let right = '';
    if(team && isBye) right = `<span class="bye-tag">BYE</span>`;
    else if(team) right = `<span class="team-score${isLive ? ' live' : ''}${leading ? ' lead' : ''}">${score != null ? Number(score).toFixed(2) : '–'}</span>`;
    row.innerHTML = `<div class="team-left">${left}</div>${right}`;
    return row;
  }

  function spawnConfetti(container){
    const colors = ['#e3a53d', '#f2f0e8', '#c1502e', '#3c5a45'];
    for(let i = 0; i < 14; i++){
      const p = document.createElement('span');
      p.className = 'confetti-piece';
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1400);
    }
  }
  function loadSeen(){ try{ const r = localStorage.getItem(SEEN_KEY); return r ? new Set(JSON.parse(r)) : null; }catch(e){ return null; } }
  function saveSeen(set){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); }catch(e){} }

  function renderBracket(){
    const el = $('bracketEl');
    el.innerHTML = '';
    const seen = loadSeen(), current = new Set(), fresh = [];
    BRACKET.forEach((round, rIdx) => {
      const col = document.createElement('div');
      col.className = 'round';
      col.innerHTML = `<div><div class="round-header">${ROUND_LABELS[rIdx]}</div><div class="round-week">${ROUND_WEEKS[rIdx]}</div></div>`;
      const rr = roundRecap(rIdx);
      if(rr){
        const d = document.createElement('div');
        d.className = 'round-recap-inline';
        d.textContent = rr;
        col.appendChild(d);
      }
      const decided = round.map((m, i) => ({ i, margin: (m.complete && m.teamA && m.teamB) ? Math.abs(m.scoreA - m.scoreB) : null })).filter(x => x.margin != null);
      let blowoutIdx = null, nailIdx = null;
      if(decided.length >= 2){
        const max = Math.max(...decided.map(x => x.margin)), min = Math.min(...decided.map(x => x.margin));
        if(max !== min){ blowoutIdx = decided.find(x => x.margin === max).i; nailIdx = decided.find(x => x.margin === min).i; }
      }
      round.forEach((m, mIdx) => {
        const id = matchId(rIdx+1, mIdx);
        const div = document.createElement('div');
        div.className = 'match' + (rIdx === 3 && m.complete ? ' champion' : '');
        const isBye = rIdx === 0 && ((m.teamA && !m.teamB) || (!m.teamA && m.teamB));
        const real = m.complete && m.teamA && m.teamB;
        if(real){ current.add(id); if(seen && !seen.has(id)) fresh.push(div); }
        const isUpset = real && ((m.winner === 'A' && m.seedA > m.seedB) || (m.winner === 'B' && m.seedB > m.seedA));
        const isLive = !m.complete && m.liveA != null && m.liveB != null;
        if(isUpset || isLive || mIdx === blowoutIdx || mIdx === nailIdx){
          const br = document.createElement('div');
          br.className = 'badge-row';
          if(isLive) br.innerHTML += `<span class="tag tag-live"><span class="live-dot"></span>Live — not final</span>`;
          if(isUpset) br.innerHTML += `<span class="tag tag-upset">🚨 Upset</span>`;
          if(mIdx === blowoutIdx) br.innerHTML += `<span class="tag tag-blowout">🔥 Blowout of the round</span>`;
          if(mIdx === nailIdx) br.innerHTML += `<span class="tag tag-nailbiter">😬 Nail-biter of the round</span>`;
          div.appendChild(br);
        }
        div.appendChild(teamRow(m, 'A', isBye, rIdx));
        div.appendChild(teamRow(m, 'B', isBye, rIdx));
        if(isLive && m.teamA && m.teamB && m.liveA !== m.liveB){
          const aLeads = m.liveA > m.liveB;
          const lose = aLeads ? m.teamB : m.teamA, win = aLeads ? m.teamA : m.teamB;
          const ls = aLeads ? m.liveB : m.liveA, ws = aLeads ? m.liveA : m.liveB;
          const margin = ws - ls;
          const tier = margin < 15 ? 'close' : margin < 50 ? 'behind' : 'crush';
          const bank = LIVE_ROAST[tier];
          const rr = document.createElement('div');
          rr.className = 'recap live-roast';
          rr.textContent = '🔥 LIVE: ' + fill(bank[(hash(id) + LIVE_TICK) % bank.length],
            { l: lose.name, w: win.name, m: margin.toFixed(2), ls: ls.toFixed(2), ws: ws.toFixed(2) });
          div.appendChild(rr);
        }
        if(real){
          const r = document.createElement('div');
          r.className = 'recap';
          r.textContent = autoRecap(m, id);
          div.appendChild(r);
        }
        col.appendChild(div);
      });
      el.appendChild(col);
    });
    fresh.forEach(div => { div.classList.add('just-decided'); spawnConfetti(div); setTimeout(() => div.classList.remove('just-decided'), 1500); });
    saveSeen(current);

    const f = BRACKET[3][0], banner = $('championBanner');
    if(f.complete){
      const champ = f.winner === 'A' ? f.teamA : f.teamB;
      banner.innerHTML = `<div class="plate">🏆 ${esc(champ.name)} — Scumbag Invitational Champion</div>`;
    } else banner.innerHTML = '';
  }

  /* ---------- predictions ---------- */
  const seedLabel = seed => { if(seed == null) return 'TBD'; const t = teamForSeed(seed); return t ? `#${seed} ${t.name}` : `#${seed}`; };
  function predicted(picks){
    const r1 = Array.from({length:8}, (_, i) => {
      const a = POS_ORDER[i*2], b = POS_ORDER[i*2+1];
      if(a > 14) return { seedA:a, seedB:b, winnerSeed:b, auto:true };
      if(b > 14) return { seedA:a, seedB:b, winnerSeed:a, auto:true };
      const p = picks[matchId(1, i)];
      return { seedA:a, seedB:b, winnerSeed:(p === a || p === b) ? p : null, auto:false };
    });
    const later = (round, n, prev) => Array.from({length:n}, (_, i) => {
      const a = prev[i*2].winnerSeed, b = prev[i*2+1].winnerSeed;
      if(a == null || b == null) return { seedA:a, seedB:b, winnerSeed:null, auto:false };
      const p = picks[matchId(round, i)];
      return { seedA:a, seedB:b, winnerSeed:(p === a || p === b) ? p : null, auto:false };
    });
    const r2 = later(2, 4, r1), r3 = later(3, 2, r2), r4 = later(4, 1, r3);
    return [r1, r2, r3, r4];
  }
  const remainingPicks = () => 13 - predicted(draft).flat().filter(m => !m.auto && m.winnerSeed != null).length;

  function renderPicker(){
    const box = $('predictPicker');
    box.innerHTML = '';
    predicted(draft).forEach((round, rIdx) => {
      const title = document.createElement('div');
      title.className = 'predict-round-title';
      title.textContent = `${ROUND_LABELS[rIdx]} — ${ROUND_WEEKS[rIdx]}`;
      box.appendChild(title);
      round.forEach((m, mIdx) => {
        const id = matchId(rIdx+1, mIdx);
        const row = document.createElement('div');
        if(m.auto){ row.className = 'predict-row auto'; row.textContent = `${seedLabel(m.winnerSeed)} — bye, auto-advances`; }
        else if(m.seedA == null || m.seedB == null){ row.className = 'predict-row auto'; row.textContent = 'Pick the previous round first'; }
        else {
          row.className = 'predict-row';
          const opts = document.createElement('div');
          opts.className = 'predict-options';
          [m.seedA, m.seedB].forEach(seed => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = 'radio'; input.name = 'pick_' + id; input.value = seed; input.checked = draft[id] === seed;
            input.addEventListener('change', () => { draft[id] = seed; renderPicker(); });
            label.appendChild(input);
            label.appendChild(document.createTextNode(' ' + seedLabel(seed)));
            opts.appendChild(label);
          });
          row.appendChild(opts);
        }
        box.appendChild(row);
      });
    });
  }

  function setupPredictions(){
    $('predictIntro').innerHTML = PRED_OPEN
      ? `Pick a full bracket before Week ${CFG.START_WEEK} kicks off. Picks are by <strong>seed number</strong>, so they still count if seeds shuffle before Week ${CFG.SEED_THROUGH_WEEK} ends. When you're done, tap <em>Get my picks code</em> and send the code to the commissioner to get on the leaderboard.`
      : `Picks are locked — the tournament has started. Here's how everyone's bracket is holding up.`;
    $('predictForm').style.display = PRED_OPEN ? '' : 'none';
    if(listenersBound) return;
    listenersBound = true;
    $('makeCodeBtn').addEventListener('click', () => {
      const name = $('predictorName').value.trim(), status = $('predictStatus');
      if(!name){ status.textContent = 'Enter your name first.'; return; }
      const left = remainingPicks();
      $('codeBox').value = JSON.stringify({ n: name, p: draft });
      $('codeWrap').classList.add('open');
      status.textContent = left ? `${left} pick${left === 1 ? '' : 's'} still empty — empty picks score zero.` : 'All picks made. Copy the code and send it to the commissioner.';
    });
    $('copyCodeBtn').addEventListener('click', async () => {
      const box = $('codeBox'); box.select();
      try{ await navigator.clipboard.writeText(box.value); $('predictStatus').textContent = 'Copied ✓'; }
      catch(e){ $('predictStatus').textContent = 'Select the code above and copy it manually.'; }
    });
  }

  function renderLeaderboard(){
    const tbody = $('leaderboardBody');
    tbody.innerHTML = '';
    const keys = Object.keys(PREDICTIONS);
    if(!keys.length){ tbody.innerHTML = `<tr><td colspan="4" style="color:var(--text-dim);font-style:italic;">No picks submitted yet.</td></tr>`; return; }
    const rows = keys.map(k => {
      const entry = PREDICTIONS[k], pred = predicted(entry.picks || {});
      let correct = 0, decided = 0, outRound = null;
      for(let r = 0; r < 4; r++) for(let i = 0; i < BRACKET[r].length; i++){
        const am = BRACKET[r][i];
        if(!am.complete || !am.teamA || !am.teamB) continue;
        const actual = am.winner === 'A' ? am.seedA : am.seedB, guess = pred[r][i].winnerSeed;
        if(guess == null) continue;
        decided++;
        if(guess === actual) correct++; else if(outRound == null) outRound = r + 1;
      }
      return { name: entry.name || k, champ: pred[3][0].winnerSeed, correct, decided, outRound };
    }).sort((a, b) => b.correct - a.correct);
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const status = r.decided === 0 ? `<span class="status-pill status-none">No results yet</span>`
        : r.outRound ? `<span class="status-pill status-out">Busted — Rd ${r.outRound}</span>`
        : `<span class="status-pill status-alive">Still alive</span>`;
      tr.innerHTML = `<td>${esc(r.name)}</td><td>${r.champ != null ? esc(seedLabel(r.champ)) : '—'}</td><td class="num">${r.correct} / ${r.decided}</td><td>${status}</td>`;
      tbody.appendChild(tr);
    });
  }

  async function loadPredictions(){
    try{
      const res = await fetch('predictions.json', { cache: 'no-store' });
      if(!res.ok) return;
      const j = await res.json();
      PRED_OPEN = j.open !== false;
      PREDICTIONS = {};
      (j.entries || []).forEach(e => { if(e && e.n) PREDICTIONS[String(e.n).toLowerCase()] = { name: e.n, picks: e.p || {} }; });
    }catch(e){}
  }

  /* ---------- kickoff countdown ---------- */
  function nextKickoff(){
    const now = new Date(), out = [];
    for(let add = 0; add < 14; add++){
      const d = new Date(now); d.setDate(d.getDate() + add); d.setHours(0,0,0,0);
      if(d.getDay() === 4){ const t = new Date(d); t.setHours(20,15,0,0); out.push(t); }
      if(d.getDay() === 0){ const t = new Date(d); t.setHours(13,0,0,0); out.push(t); }
    }
    return out.filter(t => t > now).sort((a, b) => a - b)[0] || null;
  }
  function tickKickoff(){
    const t = nextKickoff(), el = $('kickoffLine');
    if(!t){ el.textContent = ''; return; }
    const diff = t - Date.now();
    const d = Math.floor(diff / 86400000), h = Math.floor(diff % 86400000 / 3600000), m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
    el.textContent = `⏱ Next kickoff in ${d}d ${h}h ${m}m ${s}s (approx., your local time)`;
  }

  /* ---------- mulligans ---------- */
  const MULL = { teamId: null, view: null, outId: '', inId: '', msg: '', err: false, busy: false, loading: false, teamSig: '' };
  const workerBase = () => (CFG.WORKER_URL && CFG.WORKER_URL.indexOf('PASTE_YOUR') !== 0) ? CFG.WORKER_URL.replace(/\/+$/, '') : '';
  const activeSwaps = () => (DATA.mulligans || []).filter(s => s.status === 'active');
  const swapFor = (teamId, week) => activeSwaps().find(s => s.teamId === teamId && s.week === week) || null;
  const teamNameById = id => { const t = DATA.teams.find(x => x.id === id); return t ? t.name : 'Team ' + id; };
  const f2 = n => Number(n).toFixed(2);
  const signed = n => (n > 0 ? '+' : '') + f2(n);

  function mullGlyph(teamId, rIdx){
    if(rIdx == null) return '';
    const sw = swapFor(teamId, CFG.ROUND_PERIODS[rIdx]);
    return sw ? `<span class="mull-glyph" title="${esc('Mulligan: ' + sw.out.name + ' out, ' + sw.in.name + ' in')}">↺</span>` : '';
  }

  async function mullRequest(path, opts){
    const res = await fetch(workerBase() + path, { cache: 'no-store', ...(opts || {}) });
    let json = null;
    try{ json = await res.json(); }catch(e){}
    if(!res.ok) throw new Error((json && json.error) || `Service returned HTTP ${res.status}`);
    return json;
  }

  async function loadMullRoster(keepMsg){
    MULL.view = null; MULL.outId = ''; MULL.inId = '';
    if(!keepMsg){ MULL.msg = ''; MULL.err = false; }
    const asked = MULL.teamId;
    if(!asked){ renderMullPanel(); return; }
    MULL.loading = true; renderMullPanel();
    try{
      const v = await mullRequest('/roster?team=' + asked);
      if(MULL.teamId !== asked) return;
      MULL.view = v;
    }catch(e){
      if(MULL.teamId !== asked) return;
      MULL.msg = (e && e.name === 'TypeError') ? "Couldn't reach the service." : e.message; MULL.err = true;
    }
    MULL.loading = false; renderMullPanel();
  }

  function renderMullPanel(){
    const el = $('mullPanel');
    if(!MULL.teamId){ el.innerHTML = ''; return; }
    if(MULL.loading){ el.innerHTML = '<p class="mull-note">Loading lineup…</p>'; return; }
    const v = MULL.view;
    let html = '';
    if(v){
      if(!CFG.ROUND_PERIODS.includes(v.week)){
        html = `<p class="mull-note">Mulligans open during tournament weeks (Week ${CFG.ROUND_PERIODS[0]} to Week ${CFG.ROUND_PERIODS[3]}). ESPN is on Week ${esc(v.week)} right now.</p>`;
      }else if(v.used){
        html = `<p class="mull-note">${esc(teamNameById(v.teamId))} already used this round's mulligan: ${esc(v.used.out.name)} out, ${esc(v.used.in.name)} in.</p>`;
      }else{
        const outs = v.starters.filter(p => p.started && (v.options[p.id] || []).length);
        if(!outs.length){
          html = `<p class="mull-note">Nothing to swap right now. You need a starter whose game has kicked off and a bench player (who can fill that spot) whose game hasn't.</p>`;
        }else{
          const outP = outs.find(p => String(p.id) === MULL.outId) || null;
          const ins = outP ? v.bench.filter(b => (v.options[outP.id] || []).includes(b.id)) : [];
          const inP = ins.find(b => String(b.id) === MULL.inId) || null;
          html = `<div class="mull-grid">
            <div><label for="mullOut">Starter who already played</label>
              <select id="mullOut"><option value="">Choose…</option>${outs.map(p => `<option value="${p.id}"${outP && p.id === outP.id ? ' selected' : ''}>${esc(p.name)} — ${f2(p.pts)}</option>`).join('')}</select></div>
            <div><label for="mullIn">Bench player who hasn't played</label>
              <select id="mullIn"${outP ? '' : ' disabled'}><option value="">Choose…</option>${ins.map(b => `<option value="${b.id}"${inP && b.id === inP.id ? ' selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>
          </div>`;
          if(outP && inP){
            html += `<div class="mull-preview">${esc(outP.name)}'s ${f2(outP.pts)} come off. ${esc(inP.name)}'s points count instead, whatever he scores. One mulligan per round, and it can't be undone (only the commissioner can void it).</div>
              <div class="mull-controls"><button class="primary" id="mullGo"${MULL.busy ? ' disabled' : ''}>${MULL.busy ? 'Locking in…' : 'Lock in mulligan'}</button></div>`;
          }
        }
      }
    }
    if(MULL.msg) html += `<p class="mull-note${MULL.err ? ' err' : ''}">${esc(MULL.msg)}</p>`;
    el.innerHTML = html;
  }

  async function submitMull(){
    if(MULL.busy) return;
    MULL.busy = true; MULL.msg = ''; renderMullPanel();
    try{
      await mullRequest('/mulligan', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teamId: MULL.teamId, outId: Number(MULL.outId), inId: Number(MULL.inId) }) });
      MULL.busy = false;
      await sync();
      MULL.msg = 'Mulligan locked in.'; MULL.err = false;
      await loadMullRoster(true);
    }catch(e){
      MULL.busy = false;
      MULL.msg = (e && e.name === 'TypeError') ? "Couldn't reach the service." : e.message; MULL.err = true;
      renderMullPanel();
    }
  }

  async function voidSwap(id){
    const key = $('mullKey').value;
    if(!key) return;
    try{
      await mullRequest('/void', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, key }) });
      await sync();
      if(MULL.teamId) loadMullRoster();
    }catch(e){
      alert((e && e.name === 'TypeError') ? "Couldn't reach the service." : e.message);
    }
  }

  function renderMulligan(){
    const base = workerBase();
    const off = !base || DATA.mulligansEnabled === false;
    $('mullIntro').textContent = off
      ? "Mulligans aren't switched on yet."
      : "One mulligan per team per round. Swap a starter who has already played for a bench player who hasn't kicked off yet: the starter's points come off and the bench player's points count. Locks follow NFL kickoff times. Every swap is logged below for everyone to see.";
    const sel = $('mullTeam');
    const sig = SORTED.map(t => t.id + ':' + t.name).join('|') + (off ? '|off' : '');
    if(sig !== MULL.teamSig){
      MULL.teamSig = sig;
      sel.innerHTML = '<option value="">Choose your team…</option>' +
        [...DATA.teams].sort((a, b) => a.name.localeCompare(b.name)).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
      sel.value = MULL.teamId ? String(MULL.teamId) : '';
    }
    sel.disabled = off;
    $('mullPanel').style.display = off ? 'none' : '';
    const list = [...(DATA.mulligans || [])].sort((a, b) => String(b.at).localeCompare(String(a.at)));
    $('mullLog').innerHTML = list.length ? list.map(s => {
      const eff = s.status === 'active' ? (typeof s.delta === 'number' ? ` · score effect ${signed(s.delta)}` : ' · score effect pending') : ' · voided';
      return `<div class="mull-log-row${s.status === 'void' ? ' void' : ''}"><span class="when">Week ${esc(s.week)} · ${esc(new Date(s.at).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}))}</span>
        <strong>${esc(teamNameById(s.teamId))}</strong>: ${esc(s.out.name)} ↺ ${esc(s.in.name)}${eff}</div>`;
    }).join('') : (off ? '' : '<p class="mull-note">No mulligans used yet.</p>');
    const act = activeSwaps();
    $('mullAdminList').innerHTML = act.length ? act.map(s =>
      `<div class="mull-log-row">${esc(teamNameById(s.teamId))} (Wk ${esc(s.week)}): ${esc(s.out.name)} ↺ ${esc(s.in.name)} <button data-void="${esc(s.id)}">Void</button></div>`).join('')
      : '<p class="mull-note">Nothing to void.</p>';
  }

  function bindMulligan(){
    $('mullTeam').addEventListener('change', e => { MULL.teamId = e.target.value ? Number(e.target.value) : null; loadMullRoster(); });
    $('mullPanel').addEventListener('change', e => {
      if(e.target.id === 'mullOut'){ MULL.outId = e.target.value; MULL.inId = ''; renderMullPanel(); }
      else if(e.target.id === 'mullIn'){ MULL.inId = e.target.value; renderMullPanel(); }
    });
    $('mullPanel').addEventListener('click', e => { if(e.target.id === 'mullGo') submitMull(); });
    $('mullAdminList').addEventListener('click', e => { const id = e.target && e.target.getAttribute && e.target.getAttribute('data-void'); if(id) voidSwap(id); });
  }

  function renderAll(){
    recompute();
    renderStatus();
    renderRoster();
    renderBracket();
    renderMulligan();
    setupPredictions();
    renderPicker();
    renderLeaderboard();
  }

  $('footnote').innerHTML =
    `Seeds come from the standings above (record, ties broken by points for) and lock after Week ${CFG.SEED_THROUGH_WEEK}. Seeds 15 &amp; 16 are byes, so Seeds 1 and 2 skip straight to the quarterfinals. ` +
    `Weekly scores are each team's finalized ESPN score for that week, regardless of who they played in the regular league schedule.`;
  $('subLine').textContent = `14 teams · single elimination · weeks ${CFG.ROUND_PERIODS[0]} → ${CFG.ROUND_PERIODS[3]}`;
  if(CFG.IS_TEST){
    const eb = document.querySelector('.eyebrow');
    eb.textContent = 'TEST RUN · ' + eb.textContent;
  }
  $('syncBtn').addEventListener('click', sync);
  bindMulligan();

  loadCache();
  renderAll();
  tickKickoff();
  setInterval(tickKickoff, 1000);
  loadPredictions().then(renderAll);
  sync();
})();
</script>
</body>
</html>
